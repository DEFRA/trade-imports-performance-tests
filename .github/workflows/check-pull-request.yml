name: Check Pull Request

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

jobs:
  checks:
    name: Lint, format and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  image:
    name: Run the image against LocalStack
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build the image and run the suite
        run: docker compose up --build --quiet-pull --exit-code-from development development

      - name: Tear down
        if: always()
        run: docker compose down

  smoke:
    name: Smoke run against the workspace stack
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/smoke.yml
    with:
      branch: ${{ github.head_ref }}
