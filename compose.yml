services:
  development:
    build: .
    depends_on:
      localstack:
        condition: service_healthy
      target:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      S3_ENDPOINT: 'http://localstack:4566'
      RESULTS_OUTPUT_S3_PATH: 's3://test-results'
      ENVIRONMENT: local
      TRADE_IMPORTS_INS_FRONTEND_URL: 'http://target:8080'
    networks:
      - performance-tests

  k6-local:
    image: grafana/k6:2.3.0
    profiles:
      - local
    working_dir: /opt/perftest
    command: ['run', '--no-usage-report', 'src/suites/health-check.k6.js']
    volumes:
      - ./src:/opt/perftest/src:ro
    depends_on:
      target:
        condition: service_healthy
    environment:
      ENVIRONMENT: local
      TRADE_IMPORTS_INS_FRONTEND_URL: 'http://target:8080'
    networks:
      - performance-tests

  k6-workspace:
    image: grafana/k6:2.3.0
    profiles:
      - workspace
    working_dir: /opt/perftest
    command: ['run', '--no-usage-report', 'src/suites/smoke.k6.js']
    volumes:
      - ./src:/opt/perftest/src:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      ENVIRONMENT: local
      LOCALHOST_ALIAS: host.docker.internal
      AUTH_PASSWORD: '${AUTH_PASSWORD:-Password123}'
      TRAFFIC_MODEL: '${TRAFFIC_MODEL:-}'
      STUB_PROFILE: '${STUB_PROFILE:-zero-delay}'
      STUB_CEILINGS: '${STUB_CEILINGS:-}'

  defra-id-stub-ceiling:
    image: defradigital/trade-imports-defra-id-stub:${TRADE_IMPORTS_DEFRA_ID_STUB:-latest}
    profiles:
      - stub-ceiling
    environment:
      PORT: '3007'
      AUTH_PASSWORD: '${AUTH_PASSWORD:-Password123}'
      SECURE_COOKIE: 'false'
      STUB_LATENCY_PROFILE: '${STUB_PROFILE:-zero-delay}'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3007/health']
      interval: 5s
      timeout: 5s
      start_period: 3s
      retries: 10
    networks:
      - performance-tests

  k6-stub-ceilings:
    image: grafana/k6:2.3.0
    profiles:
      - stub-ceiling
    working_dir: /opt/perftest
    command: ['run', '--no-usage-report', 'src/suites/breakpoint-stubs.k6.js']
    volumes:
      - ./src:/opt/perftest/src:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      defra-id-stub-ceiling:
        condition: service_healthy
    networks:
      - performance-tests
    environment:
      ENVIRONMENT: local
      LOCALHOST_ALIAS: host.docker.internal
      AUTH_PASSWORD: '${AUTH_PASSWORD:-Password123}'
      STUB_PROFILE: '${STUB_PROFILE:-zero-delay}'
      STUB_CEILING_GROUPS: '${STUB_CEILING_GROUPS:-}'
      STUB_CEILING_MODEL: '${STUB_CEILING_MODEL:-}'
      STUB_CEILINGS: '${STUB_CEILINGS:-}'
      TRADE_IMPORTS_DEFRA_ID_STUB_URL: 'http://defra-id-stub-ceiling:3007'

  localstack:
    image: localstack/localstack:4.3.0
    env_file:
      - 'compose/aws.env'
    environment:
      LS_LOG: WARN
      SERVICES: s3
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - ./compose/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ['CMD', 'stat', '/tmp/READY']
      interval: 3s
      start_period: 5s
      retries: 10
    networks:
      - performance-tests

  target:
    image: nginx:1.29-alpine
    volumes:
      - ./compose/target/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 3s
      start_period: 3s
      retries: 10
    networks:
      - performance-tests

networks:
  performance-tests:
    driver: bridge
